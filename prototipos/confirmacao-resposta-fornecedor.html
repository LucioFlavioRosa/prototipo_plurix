<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmação de Resposta | Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #222;
    }
    body {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #1a2340;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding-top: 32px;
      box-shadow: 2px 0 8px rgba(30,40,80,0.07);
      position: relative;
      z-index: 2;
    }
    .sidebar .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .sidebar .logo img {
      width: 120px;
      height: auto;
    }
    .sidebar nav {
      flex: 1;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      padding: 14px 32px;
      color: #fff;
      text-decoration: none;
      font-size: 1.08rem;
      border-left: 4px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 2px;
    }
    .sidebar nav a.active, .sidebar nav a:hover {
      background: #222b4a;
      border-left: 4px solid #f9b233;
      color: #f9b233;
    }
    .sidebar .bottom {
      margin-bottom: 32px;
      text-align: center;
      font-size: 0.95rem;
      color: #b7b9c6;
    }
    .main-content {
      flex: 1;
      padding: 0 0 0 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      background: #fff;
      padding: 24px 40px 16px 40px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a2340;
      margin: 0;
    }
    .dashboard-section {
      padding: 32px 40px 40px 40px;
      flex: 1;
      background: #f7f8fa;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.07);
      padding: 40px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      min-width: 340px;
      max-width: 420px;
      align-items: center;
      text-align: center;
    }
    .card .success-icon {
      font-size: 3.2rem;
      color: #4bb543;
      margin-bottom: 18px;
    }
    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a2340;
      margin-bottom: 12px;
    }
    .card-message {
      font-size: 1.08rem;
      color: #222;
      margin-bottom: 24px;
    }
    .cta-upload {
      background: #f9b233;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 28px;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
      box-shadow: 0 2px 8px rgba(249,178,51,0.08);
      margin-bottom: 12px;
      width: 100%;
      max-width: 300px;
    }
    .cta-upload:hover {
      background: #e1a12a;
    }
    .link-editar {
      color: #1a2340;
      text-decoration: underline;
      font-weight: 600;
      font-size: 1.05rem;
      margin-top: 10px;
      display: inline-block;
      transition: color 0.15s, text-decoration 0.15s;
    }
    .link-editar:hover {
      color: #f9b233;
      text-decoration: none;
    }
    @media (max-width: 900px) {
      .dashboard-section {
        padding: 24px 10px 24px 10px;
      }
      .header {
        padding: 18px 10px 12px 10px;
      }
      .sidebar {
        width: 70px;
        padding-top: 12px;
      }
      .sidebar .logo img {
        width: 44px;
      }
      .sidebar nav a {
        padding: 10px 10px;
        font-size: 0.98rem;
      }
      .card {
        padding: 24px 10px 18px 10px;
        min-width: 220px;
        max-width: 98vw;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_180,h_180,al_c,q_85,usm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
    </div>
    <nav>
      <a href="dashboard-fornecedor.html">Dashboard</a>
      <a href="upload-tabela.html">Nova Tabela</a>
      <a href="historico.html">Histórico</a>
      <a href="index.html">Sair</a>
    </nav>
    <div class="bottom">&copy; 2024 Plurix</div>
  </aside>
  <div class="main-content">
    <header class="header">
      <h1>Confirmação de Resposta</h1>
    </header>
    <main class="dashboard-section">
      <section class="card" role="status" aria-live="polite">
        <div class="success-icon" aria-label="Sucesso">&#10003;</div>
        <div class="card-title">Resposta enviada com sucesso!</div>
        <div class="card-message">Sua resposta foi registrada e está em processamento.<br>Você pode acompanhar o status no Dashboard ou editar sua resposta se necessário.</div>
        <button class="cta-upload" onclick="window.location.href='dashboard-fornecedor.html'">Ir para Dashboard</button>
        <a href="upload-tabela.html" class="link-editar" aria-label="Editar resposta">Editar resposta enviada</a>
      </section>
    </main>
  </div>
</body>
</html>
