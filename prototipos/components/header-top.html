<header class="header">
  <div style="display: flex; align-items: center;">
    <h1 id="page-title" style="margin: 0; font-size: 2rem; font-weight: 700; color: #1a2340;">Dashboard de Cotações</h1>
    <button id="main-action-btn" class="cta-upload" style="margin-left: 32px;">+ Nova Cotação</button>
  </div>
  <div style="display: flex; align-items: center;">
    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Foto do usuário" style="width:44px; height:44px; border-radius:50%; margin-right:12px;">
    <div>
      <span style="font-weight:700; color:#1a2340;">João Silva</span><br>
      <span style="font-size:0.98rem; color:#b7b9c6;">Gerente de Compras</span>
    </div>
  </div>
</header>
<script>
// Exemplo de título dinâmico e botão principal
function setHeader(title, actionText, actionCallback) {
  document.getElementById('page-title').textContent = title;
  var btn = document.getElementById('main-action-btn');
  btn.textContent = actionText;
  btn.onclick = actionCallback;
}

</script>
