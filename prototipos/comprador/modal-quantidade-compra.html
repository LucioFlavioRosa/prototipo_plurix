<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selecionar Quantidade de Compra | Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif; background: #f7f8fa; color: #222; }
    /* Removido .modal overlay, pois será gerenciado pelo pai */
    .modal-content {
      background: #fff;
      max-width: 420px;
      width: 98%;
      padding: 32px 26px 24px 26px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(30,40,80,0.13);
      animation: slideIn 0.3s ease;
      outline: none;
      margin: 0 auto;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .modal-title { font-size: 1.25rem; font-weight: 700; color: #1a2340; margin: 0; }
    .modal-close { cursor: pointer; font-size: 28px; color: #999; background: none; border: none; line-height: 1; margin-left: 16px; transition: color 0.18s; }
    .modal-close:hover { color: #e74c3c; }
    .modal-body { font-size: 1.05rem; line-height: 1.6; color: #222; }
    .input-label { font-weight: 600; color: #1a2340; margin-top: 14px; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 9px 10px; border: 1px solid #b7b9c6; border-radius: 4px; font-size: 1rem; background: #f7f8fa; color: #222; box-sizing: border-box; margin-bottom: 18px; }
    .form-input:focus { outline: 2px solid #f9b233; background: #fffbe7; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; }
    .btn-primary { background: #f9b233; color: #fff; border: none; border-radius: 6px; padding: 11px 28px; font-size: 1.08rem; font-weight: 700; cursor: pointer; transition: background 0.18s; box-shadow: 0 2px 8px rgba(249,178,51,0.08); }
    .btn-primary:hover { background: #e1a12a; }
    .btn-secondary { background: #eaeaea; color: #1a2340; border: none; border-radius: 6px; padding: 11px 22px; font-size: 1.08rem; font-weight: 700; cursor: pointer; transition: background 0.18s; }
    .btn-secondary:hover { background: #d0d0d0; }
    @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 600px) { .modal-content { padding: 14px 4px 12px 4px; } }
  </style>
</head>
<body>
  <div class="modal-content" tabindex="0">
    <div class="modal-header">
      <span class="modal-title">Selecionar Quantidade de Compra</span>
      <button class="modal-close" aria-label="Fechar" onclick="window.parent.fecharOverlayModalQuantidade()">&times;</button>
    </div>
    <div class="modal-body">
      <div><strong>Fornecedor:</strong> <span id="fornecedor-nome">Fornecedor Exemplo S.A.</span></div>
      <div><strong>Produto:</strong> <span id="produto-nome">Filé de Frango Resfriado 1kg</span></div>
      <div><strong>Preço Unitário:</strong> <span id="preco-unitario">R$ 14,90</span></div>
      <label for="quantidade" class="input-label">Quantidade a Comprar</label>
      <input type="number" id="quantidade" class="form-input" min="1" step="1" placeholder="Digite a quantidade" aria-label="Quantidade a Comprar">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="window.parent.fecharOverlayModalQuantidade()">Cancelar</button>
      <button class="btn-primary" onclick="confirmarCompra()">Confirmar</button>
    </div>
  </div>
  <script>
    // Inicializa os dados do modal ao carregar
    document.addEventListener('DOMContentLoaded', function() {
      var dadosRaw = sessionStorage.getItem('modalQuantidadeCompra');
      if (!dadosRaw) {
        document.getElementById('fornecedor-nome').textContent = '-';
        document.getElementById('produto-nome').textContent = '-';
        document.getElementById('preco-unitario').textContent = '-';
        return;
      }
      try {
        var dados = JSON.parse(dadosRaw);
        document.getElementById('fornecedor-nome').textContent = dados.fornecedor || '-';
        document.getElementById('produto-nome').textContent = dados.produto || '-';
        document.getElementById('preco-unitario').textContent = dados.preco ? 'R$ ' + dados.preco : '-';
      } catch (e) {
        document.getElementById('fornecedor-nome').textContent = '-';
        document.getElementById('produto-nome').textContent = '-';
        document.getElementById('preco-unitario').textContent = '-';
      }
    });

    function confirmarCompra() {
      var dadosRaw = sessionStorage.getItem('modalQuantidadeCompra');
      if (!dadosRaw) {
        alert('Dados do fornecedor não encontrados. Por favor, tente novamente.');
        window.parent.fecharOverlayModalQuantidade();
        return;
      }
      var quantidade = document.getElementById('quantidade').value;
      if (!quantidade || isNaN(Number(quantidade)) || Number(quantidade) <= 0) {
        alert('Informe uma quantidade válida.');
        document.getElementById('quantidade').focus();
        return;
      }
      try {
        var dados = JSON.parse(dadosRaw);
        dados.quantidadeConfirmada = quantidade;
        sessionStorage.setItem('modalQuantidadeCompra', JSON.stringify(dados));
        alert('Compra confirmada! Quantidade: ' + quantidade);
        window.parent.fecharOverlayModalQuantidade();
      } catch (e) {
        alert('Erro ao processar os dados. Por favor, tente novamente.');
        window.parent.fecharOverlayModalQuantidade();
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.parent.fecharOverlayModalQuantidade();
      }
    });
  </script>
</body>
</html>
