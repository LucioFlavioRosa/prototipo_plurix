<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proposta do Fornecedor | Plurix Comprador</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif; background: #f7f8fa; color: #222; }
    .modal-bg { display: flex; justify-content: center; align-items: center; position: fixed; z-index: 1000; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(30,40,80,0.35); }
    .modal-content { background: #fff; max-width: 700px; width: 98%; padding: 32px; border-radius: 12px; box-shadow: 0 8px 32px rgba(30,40,80,0.13); max-height: 90vh; overflow-y: auto; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .modal-title { font-size: 1.35rem; font-weight: 700; color: #1a2340; margin: 0; }
    .modal-close { cursor: pointer; font-size: 28px; color: #999; background: none; border: none; line-height: 1; margin-left: 16px; transition: color 0.18s; }
    .modal-close:hover { color: #e74c3c; }
    .modal-body { font-size: 1.05rem; line-height: 1.6; color: #222; }
    .card-table { width: 100%; border-collapse: collapse; font-size: 1.05rem; margin-bottom: 18px; }
    .card-table th, .card-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .card-table th { background: #e8eaf0; color: #1a2340; font-weight: 700; }
    .kpi-section { margin: 18px 0 10px 0; }
    .kpi-title { font-size: 1.13rem; font-weight: 700; color: #1a2340; margin-bottom: 8px; }
    .kpi-graphs { display: flex; flex-wrap: wrap; gap: 24px; }
    .kpi-graph { background: #f7f8fa; border-radius: 8px; padding: 12px 10px; flex: 1 1 240px; min-width: 220px; text-align: center; }
    .kpi-graph canvas { max-width: 180px; height: 90px; object-fit: contain; }
    .modal-actions { margin-top: 24px; display: flex; gap: 16px; justify-content: flex-end; }
    .btn { padding: 12px 28px; font-size: 1.08rem; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; transition: background 0.18s; }
    .btn-ok { background: #4bb543; color: #fff; }
    .btn-ok:hover { background: #399a36; }
    @media (max-width: 700px) {
      .modal-content { padding: 12px 2px 12px 2px; }
      .kpi-graphs { flex-direction: column; gap: 10px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // Dados mockados para Banana Prata
    const propostasBananaPrata = {
      'Ceasa Sul': {
        fornecedor: 'Ceasa Sul',
        produto: 'Banana Prata',
        preco: '3,90',
        quantidade: '800 kg',
        dataEnvio: '14/06/2024',
        pontualidade: [95, 97, 98, 99, 97, 98, 99],
        qualidade: [93, 94, 96, 95, 97, 96, 98],
        historicoPreco: [3.60, 3.75, 3.80, 3.85, 3.90, 4.00, 3.90],
        mercado: {
          esalq: [3.65, 3.70, 3.78, 3.82, 3.85, 3.95, 3.92],
          milkpoint: [3.62, 3.68, 3.76, 3.80, 3.88, 3.97, 3.93],
          safras: [3.70, 3.73, 3.79, 3.84, 3.89, 3.98, 3.94]
        }
      },
      'Frutas do Vale': {
        fornecedor: 'Frutas do Vale',
        produto: 'Banana Prata',
        preco: '4,10',
        quantidade: '800 kg',
        dataEnvio: '14/06/2024',
        pontualidade: [92, 94, 95, 96, 95, 97, 96],
        qualidade: [91, 92, 93, 94, 95, 95, 96],
        historicoPreco: [3.80, 3.85, 3.90, 4.00, 4.10, 4.15, 4.10],
        mercado: {
          esalq: [3.65, 3.70, 3.78, 3.82, 3.85, 3.95, 3.92],
          milkpoint: [3.62, 3.68, 3.76, 3.80, 3.88, 3.97, 3.93],
          safras: [3.70, 3.73, 3.79, 3.84, 3.89, 3.98, 3.94]
        }
      }
    };
    // Recupera dados do sessionStorage
    let dadosModal = sessionStorage.getItem('modalPropostaFornecedor');
    let proposta = null;
    if (dadosModal) {
      try {
        const obj = JSON.parse(dadosModal);
        if (obj.produto === 'Banana Prata') {
          proposta = propostasBananaPrata[obj.fornecedor];
        }
      } catch (e) {}
    }
    // Fallback
    if (!proposta) proposta = propostasBananaPrata['Ceasa Sul'];

    function fecharModal() {
      // Ao fechar, volta para cotacao-pronta.html
      window.location.href = 'cotacao-pronta.html';
    }
    function renderDadosProposta() {
      document.getElementById('modal-title').textContent = 'Proposta de ' + proposta.fornecedor;
      document.getElementById('info-produto').textContent = proposta.produto;
      document.getElementById('info-quantidade').textContent = proposta.quantidade;
      document.getElementById('info-data-entrega').textContent = '16/06/2024';
      document.getElementById('td-fornecedor').textContent = proposta.fornecedor;
      document.getElementById('td-preco').textContent = proposta.preco;
      document.getElementById('td-quantidade').textContent = proposta.quantidade;
      document.getElementById('td-data-envio').textContent = proposta.dataEnvio;
    }
    document.addEventListener('DOMContentLoaded', function() {
      renderDadosProposta();
      // Gráfico Pontualidade
      new Chart(document.getElementById('pontualidadeChart'), {
        type: 'line',
        data: {
          labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul'],
          datasets: [{
            label: 'Pontualidade (%)',
            data: proposta.pontualidade,
            borderColor: '#4bb543',
            backgroundColor: 'rgba(75,181,67,0.12)',
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { min: 85, max: 100 } }
        }
      });
      // Gráfico Qualidade
      new Chart(document.getElementById('qualidadeChart'), {
        type: 'line',
        data: {
          labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul'],
          datasets: [{
            label: 'Qualidade (%)',
            data: proposta.qualidade,
            borderColor: '#1a2340',
            backgroundColor: 'rgba(26,35,64,0.12)',
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { min: 85, max: 100 } }
        }
      });
      // Gráfico Histórico de Preço vs. Mercado
      new Chart(document.getElementById('historicoPrecoChart'), {
        type: 'line',
        data: {
          labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul'],
          datasets: [
            {
              label: proposta.fornecedor,
              data: proposta.historicoPreco,
              borderColor: '#f9b233',
              backgroundColor: 'rgba(249,178,51,0.10)',
              tension: 0.3,
              fill: false
            },
            {
              label: 'Esalq CEPEA',
              data: proposta.mercado.esalq,
              borderColor: '#1a2340',
              borderDash: [4,2],
              fill: false
            },
            {
              label: 'Milkpoint',
              data: proposta.mercado.milkpoint,
              borderColor: '#4bb543',
              borderDash: [2,2],
              fill: false
            },
            {
              label: 'Safras',
              data: proposta.mercado.safras,
              borderColor: '#e74c3c',
              borderDash: [1,2],
              fill: false
            }
          ]
        },
        options: {
          plugins: { legend: { display: true } },
          scales: { y: { min: 3.5, max: 4.3 } }
        }
      });
    });
  </script>
</head>
<body>
  <div class="modal-bg" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-content" tabindex="0">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Proposta de Ceasa Sul</span>
        <button class="modal-close" aria-label="Fechar" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:18px;">
          <strong>Produto:</strong> <span id="info-produto">Banana Prata</span> &nbsp; | &nbsp;
          <strong>Quantidade:</strong> <span id="info-quantidade">800 kg</span> &nbsp; | &nbsp;
          <strong>Data de Entrega:</strong> <span id="info-data-entrega">16/06/2024</span>
        </div>
        <table class="card-table" aria-label="Proposta do Fornecedor">
          <thead>
            <tr>
              <th>Fornecedor</th>
              <th>Preço Unitário (R$)</th>
              <th>Quantidade</th>
              <th>Data Envio</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="td-fornecedor">Ceasa Sul</td>
              <td id="td-preco">3,90</td>
              <td id="td-quantidade">800 kg</td>
              <td id="td-data-envio">14/06/2024</td>
            </tr>
          </tbody>
        </table>
        <div class="kpi-section">
          <div class="kpi-title">Pontualidade na Entrega</div>
          <div class="kpi-graphs">
            <div class="kpi-graph">
              <canvas id="pontualidadeChart" width="180" height="90"></canvas>
            </div>
          </div>
        </div>
        <div class="kpi-section">
          <div class="kpi-title">Qualidade da Entrega</div>
          <div class="kpi-graphs">
            <div class="kpi-graph">
              <canvas id="qualidadeChart" width="180" height="90"></canvas>
            </div>
          </div>
        </div>
        <div class="kpi-section">
          <div class="kpi-title">Histórico de Preço vs. Índices de Mercado</div>
          <div class="kpi-graphs">
            <div class="kpi-graph">
              <canvas id="historicoPrecoChart" width="180" height="90"></canvas>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ok" onclick="fecharModal()">OK</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
