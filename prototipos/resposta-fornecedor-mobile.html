<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responder Cotação | Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #222;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #f7f8fa;
    }
    .mobile-header {
      width: 100%;
      background: #fff;
      padding: 18px 0 12px 0;
      box-shadow: 0 2px 8px rgba(30,40,80,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .mobile-header img {
      width: 44px;
      height: 44px;
      margin-right: 12px;
    }
    .mobile-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a2340;
      margin: 0;
    }
    .mobile-main {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 24px 12px 0 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.07);
      padding: 28px 18px 22px 18px;
      width: 100%;
      max-width: 370px;
      display: flex;
      flex-direction: column;
      margin-bottom: 24px;
    }
    .form-card h2 {
      font-size: 1.18rem;
      font-weight: 700;
      color: #1a2340;
      margin-bottom: 18px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 1.05rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
    }
    .form-group input {
      padding: 12px 10px;
      font-size: 1.08rem;
      border: 1px solid #b7b9c6;
      border-radius: 6px;
      background: #f7f8fa;
      color: #222;
      box-sizing: border-box;
      transition: border 0.15s, background 0.15s;
    }
    .form-group input:focus {
      outline: 2px solid #f9b233;
      background: #fffbe7;
    }
    .btn-enviar {
      background: #f9b233;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 16px 0;
      font-size: 1.18rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(249,178,51,0.08);
      width: 100%;
      margin-top: 10px;
      transition: background 0.18s;
      letter-spacing: 0.02em;
    }
    .btn-enviar:hover, .btn-enviar:focus {
      background: #e1a12a;
    }
    .mobile-footer {
      width: 100%;
      text-align: center;
      font-size: 0.98rem;
      color: #b7b9c6;
      margin-top: 30px;
      margin-bottom: 12px;
    }
    @media (max-width: 900px) {
      .mobile-main {
        padding: 14px 2px 0 2px;
      }
      .form-card {
        padding: 18px 6px 14px 6px;
        max-width: 99vw;
      }
      .btn-enviar {
        padding: 16px 0;
        font-size: 1.12rem;
      }
      .mobile-header {
        padding: 12px 0 8px 0;
      }
      .mobile-header img {
        width: 36px;
        height: 36px;
        margin-right: 8px;
      }
    }
    @media (max-width: 500px) {
      .form-card {
        padding: 10px 2px 10px 2px;
      }
      .mobile-main {
        padding: 8px 0 0 0;
      }
    }
  </style>
</head>
<body>
  <header class="mobile-header">
    <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_180,h_180,al_c,q_85,usm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
    <h1>Responder Cotação</h1>
  </header>
  <main class="mobile-main">
    <form class="form-card" autocomplete="off" action="confirmacao-resposta-fornecedor.html" method="get" aria-label="Formulário de Resposta de Cotação">
      <h2>Preencha sua proposta</h2>
      <div class="form-group">
        <label for="volume">Volume disponível</label>
        <input type="number" id="volume" name="volume" min="1" inputmode="numeric" pattern="[0-9]*" required aria-required="true" placeholder="Ex: 500" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="preco">Preço unitário (R$)</label>
        <input type="number" id="preco" name="preco" min="0" step="0.01" inputmode="decimal" required aria-required="true" placeholder="Ex: 12.50" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="prazo">Prazo de entrega (dias)</label>
        <input type="number" id="prazo" name="prazo" min="1" max="60" inputmode="numeric" pattern="[0-9]*" required aria-required="true" placeholder="Ex: 7" autocomplete="off">
      </div>
      <button type="submit" class="btn-enviar" aria-label="Enviar Resposta">Enviar Resposta</button>
    </form>
    <div class="mobile-footer">&copy; 2024 Plurix</div>
  </main>
</body>
</html>
