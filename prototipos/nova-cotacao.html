<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Cotação | Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #222;
    }
    body {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #1a2340;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding-top: 32px;
      box-shadow: 2px 0 8px rgba(30,40,80,0.07);
      position: relative;
      z-index: 2;
    }
    .sidebar .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .sidebar .logo img {
      width: 120px;
      height: auto;
    }
    .sidebar nav {
      flex: 1;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      padding: 14px 32px;
      color: #fff;
      text-decoration: none;
      font-size: 1.08rem;
      border-left: 4px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 2px;
    }
    .sidebar nav a.active, .sidebar nav a:hover {
      background: #222b4a;
      border-left: 4px solid #f9b233;
      color: #f9b233;
    }
    .sidebar .bottom {
      margin-bottom: 32px;
      text-align: center;
      font-size: 0.95rem;
      color: #b7b9c6;
    }
    .main-content {
      flex: 1;
      padding: 0 0 0 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      background: #fff;
      padding: 24px 40px 16px 40px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a2340;
      margin: 0;
    }
    .dashboard-section {
      padding: 32px 40px 40px 40px;
      flex: 1;
      background: #f7f8fa;
      min-height: 0;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.07);
      padding: 32px 28px 26px 28px;
      display: flex;
      flex-direction: column;
      min-width: 320px;
      max-width: 600px;
      margin: 0 auto;
    }
    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a2340;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-weight: 600;
      color: #1a2340;
      margin-bottom: 6px;
      font-size: 1.08rem;
    }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #b7b9c6;
      font-size: 1.05rem;
      background: #f7f8fa;
      color: #222;
      box-sizing: border-box;
      transition: border 0.15s, background 0.15s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: 2px solid #f9b233;
      background: #fffbe7;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 24px;
    }
    .btn {
      padding: 12px 28px;
      font-size: 1.08rem;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.18s;
      box-shadow: 0 2px 8px rgba(30,40,80,0.08);
      display: inline-block;
    }
    .btn-primary {
      background: #f9b233;
      color: #fff;
    }
    .btn-primary:hover {
      background: #e1a12a;
    }
    .btn-secondary {
      background: #1a2340;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #222b4a;
    }
    @media (max-width: 900px) {
      .dashboard-section {
        padding: 24px 10px 24px 10px;
      }
      .header {
        padding: 18px 10px 12px 10px;
      }
      .sidebar {
        width: 70px;
        padding-top: 12px;
      }
      .sidebar .logo img {
        width: 44px;
      }
      .sidebar nav a {
        padding: 10px 10px;
        font-size: 0.98rem;
      }
      .card {
        padding: 16px 6px 16px 6px;
        min-width: 0;
        max-width: 99vw;
      }
    }
  </style>
  <script>
    function selecionarFornecedores() {
      window.location.href = 'selecionar-fornecedores.html';
    }
    function revisarMensagem() {
      window.location.href = 'preview-mensagem-whatsapp.html';
    }
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_180,h_180,al_c,q_85,usm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
    </div>
    <nav>
      <a href="dashboard-fornecedor.html">Dashboard</a>
      <a href="upload-tabela.html">Nova Tabela</a>
      <a href="historico.html">Histórico</a>
      <a href="index.html">Sair</a>
    </nav>
    <div class="bottom">&copy; 2024 Plurix</div>
  </aside>
  <div class="main-content">
    <header class="header">
      <h1>Nova Cotação</h1>
    </header>
    <main class="dashboard-section">
      <div class="card">
        <div class="card-title">Registrar Demanda de Compra</div>
        <form autocomplete="off">
          <div class="form-group">
            <label for="produto">Produto</label>
            <input type="text" id="produto" name="produto" placeholder="Nome ou SKU do produto" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" name="quantidade" min="1" step="any" placeholder="Quantidade desejada" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="prazo">Prazo de Entrega</label>
            <input type="date" id="prazo" name="prazo" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="fornecedores">Fornecedores Selecionados</label>
            <textarea id="fornecedores" name="fornecedores" rows="2" placeholder="Selecione fornecedores" readonly aria-readonly="true"></textarea>
            <button type="button" class="btn btn-secondary" style="margin-top:8px;" onclick="selecionarFornecedores()">Selecionar Fornecedores</button>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-primary" onclick="revisarMensagem()">Revisar Mensagem</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
