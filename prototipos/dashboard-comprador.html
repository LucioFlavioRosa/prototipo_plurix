<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard do Comprador - Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="shortcut icon" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_32%2Ch_32%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_180%2Ch_180%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #222;
    }
    body {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #1a2340;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding-top: 32px;
      box-shadow: 2px 0 8px rgba(30,40,80,0.07);
      position: relative;
      z-index: 2;
    }
    .sidebar .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .sidebar .logo img {
      width: 120px;
      height: auto;
    }
    .sidebar nav {
      width: 100%;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .sidebar nav a {
      display: block;
      width: 100%;
      padding: 14px 32px;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0;
      font-size: 1.08rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      border-left: 4px solid transparent;
      margin-bottom: 2px;
    }
    .sidebar nav a.active, .sidebar nav a:hover {
      background: #222b4a;
      border-left: 4px solid #f9b233;
      color: #f9b233;
    }
    .sidebar .bottom {
      margin-bottom: 32px;
      text-align: center;
      font-size: 0.95rem;
      color: #b7b9c6;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 0 0 0;
    }
    .header {
      background: #fff;
      padding: 24px 40px 16px 40px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.04);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .main-header {
      font-size: 2rem;
      font-weight: 700;
      color: #1a2340;
      letter-spacing: 0.5px;
      margin: 0;
      background: none;
      padding: 0;
    }
    .dashboard-section {
      padding: 32px 40px 40px 40px;
      flex: 1;
      background: #f7f8fa;
      min-height: 0;
    }
    .filters {
      display: flex;
      gap: 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filters label {
      font-size: 1rem;
      font-weight: 600;
      color: #444;
      margin-right: 6px;
    }
    .filters select, .filters input[type="date"] {
      padding: 7px 14px;
      border-radius: 5px;
      border: 1px solid #b7b9c6;
      font-size: 1rem;
      background: #fff;
      color: #222;
    }
    .btn-limpar {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: 10px;
      transition: background 0.18s;
    }
    .btn-limpar:hover {
      background: #b93a2e;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.07);
      padding: 32px 28px 26px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      min-height: 120px;
    }
    .card-title {
      font-size: 1.1rem;
      color: #888;
      font-weight: 600;
    }
    .card-value {
      font-size: 2.1rem;
      font-weight: 700;
      color: #1a2340;
      margin-top: 6px;
    }
    .card-indicator {
      font-size: 1rem;
      color: #16a34a;
      font-weight: 600;
      margin-left: 8px;
    }
    .table-section {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.07);
      padding: 28px 24px 24px 24px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 18px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      font-size: 1rem;
    }
    .data-table th, .data-table td {
      padding: 12px 10px;
      text-align: left;
    }
    .data-table th {
      background: #e8eaf0;
      color: #222;
      font-weight: 700;
      border-bottom: 2px solid #eaeaea;
    }
    .data-table tr {
      border-bottom: 1px solid #f0f0f0;
    }
    .data-table tr:last-child {
      border-bottom: none;
    }
    .btn-table {
      background: #f9b233;
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }
    .btn-table:hover {
      background: #e1a12a;
    }
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 30px;
      border-radius: 12px;
      width: 80%;
      max-width: 900px;
      box-shadow: 0 8px 32px rgba(30,40,80,0.13);
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover {
      color: #000;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      display: inline-block;
    }
    .badge-analise {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-aprovada {
      background: #d1fae5;
      color: #065f46;
    }
    .badge-reprovada {
      background: #fee2e2;
      color: #991b1b;
    }
    .sortable {
      cursor: pointer;
      user-select: none;
    }
    .sortable:hover {
      background: #e5e7eb;
    }
    .sort-asc::after {
      content: ' ▲';
    }
    .sort-desc::after {
      content: ' ▼';
    }
    @media (max-width: 1000px) {
      .sidebar {
        width: 70px;
        padding-top: 12px;
      }
      .sidebar .logo img {
        width: 44px;
      }
    }
    @media (max-width: 900px) {
      .dashboard-section {
        padding: 24px 10px 24px 10px;
      }
      .header {
        padding: 18px 10px 12px 10px;
      }
      .sidebar {
        width: 70px;
        padding-top: 12px;
      }
      .sidebar .logo img {
        width: 44px;
      }
      .sidebar nav a {
        padding: 10px 10px;
        font-size: 0.98rem;
      }
    }
    @media (max-width: 700px) {
      .main-header { font-size: 1.1rem; }
      .card-grid { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main-content { padding: 0 2vw 18px 2vw; }
      .modal-content {
        width: 95%;
        margin: 10% auto;
        padding: 20px;
      }
      .data-table th, .data-table td {
        font-size: 0.85rem;
        padding: 8px 6px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="Menu principal">
    <div class="logo">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_192,h_192,al_c,q_85/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
    </div>
    <nav>
      <a href="dashboard-comprador.html" class="active">Dashboard</a>
      <a href="index.html" style="color:#d4380d;">Sair</a>
    </nav>
    <div class="bottom">&copy; 2024 Plurix</div>
  </aside>
  <div class="main-content">
    <header class="header">
      <h1 class="main-header">Dashboard do Comprador</h1>
    </header>
    <main class="dashboard-section">
      <form class="filters" aria-label="Filtros de pesquisa" onsubmit="return false;">
        <label>Fornecedor:
          <select id="fornecedor">
            <option value="">Todos</option>
          </select>
        </label>
        <label>Bandeira:
          <select id="bandeira">
            <option value="">Todas</option>
            <option value="superpao">Superpão</option>
            <option value="boa">Boa Supermercados</option>
            <option value="avenida">Supermercados Avenida</option>
            <option value="compremais">Compre Mais</option>
            <option value="emporio">Empório Dom Olívio</option>
            <option value="amigao">Grupo Amigão</option>
            <option value="parana">Paraná Supermercados</option>
          </select>
        </label>
        <label>UF:
          <select id="uf">
            <option value="">Todas</option>
          </select>
        </label>
        <label>Data:
          <input type="date" id="dataFiltro">
        </label>
        <label>Status:
          <select id="status">
            <option value="">Todos</option>
            <option value="em_analise">Em Análise</option>
            <option value="aprovada">Aprovada</option>
            <option value="reprovada">Reprovada</option>
          </select>
        </label>
        <button type="button" class="btn-limpar" onclick="resetarFiltros()">Limpar Filtros</button>
      </form>
      <section class="table-section">
        <div class="section-title">Tabelas Submetidas</div>
        <table class="data-table" aria-label="Tabelas submetidas">
          <thead>
            <tr>
              <th class="sortable" data-col="fornecedor">Fornecedor</th>
              <th class="sortable" data-col="bandeira">Bandeira</th>
              <th class="sortable" data-col="uf">UF</th>
              <th class="sortable" data-col="dataSubmissao">Data Submissão</th>
              <th class="sortable" data-col="variacao">Variação (%)</th>
              <th class="sortable" data-col="impactoDRE">Impacto DRE</th>
              <th class="sortable" data-col="icNielsen">IC Nielsen</th>
              <th class="sortable" data-col="status">Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaSubmetidasBody">
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <div id="modalDetalhes" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <h2>Detalhes da Tabela Submetida</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Descrição</th>
            <th>Preço Antigo</th>
            <th>Preço Novo</th>
            <th>Variação de Preço</th>
            <th>Data da Submissão</th>
          </tr>
        </thead>
        <tbody id="modalTabelaBody"></tbody>
      </table>
    </div>
  </div>
  <script>
    // ... (todo o JS permanece igual)
    // Passo 3: Mapeamento de bandeiras para UFs
    const bandeiraUF = {
      superpao: ['PR','SC','RS'],
      boa: ['SP','MG'],
      avenida: ['MS','MT'],
      compremais: ['GO','DF','TO'],
      emporio: ['RJ','ES'],
      amigao: ['BA','SE','AL'],
      parana: ['PR','SP']
    };
    // ... (demais scripts idênticos ao original)
  </script>
  <div style="display:none">
    <!-- Cards de métricas (apenas para garantir que atualizarCards funcione) -->
    <span id="tabelasPendentes"></span>
    <span id="variacaoMedia"></span>
    <span id="impactoDRE"></span>
    <span id="icNielsen"></span>
    <span id="icObjetiva"></span>
  </div>
</body>
</html>
