<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard do Comprador - Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="shortcut icon" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_32%2Ch_32%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_180%2Ch_180%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 32px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.03);
    }
    .sidebar img {
      width: 60px;
      margin-bottom: 18px;
    }
    .sidebar nav {
      width: 100%;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sidebar a {
      display: block;
      width: 100%;
      padding: 12px 32px;
      color: #1a6ae5;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px 0 0 6px;
      font-size: 1.08rem;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar a.active, .sidebar a:hover {
      background: #eaf2ff;
      color: #144fa1;
    }
    .main-content {
      flex: 1;
      padding: 0 40px 40px 40px;
      display: flex;
      flex-direction: column;
    }
    .main-header {
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eaeaea;
      background: #fff;
      margin-bottom: 32px;
      padding-left: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }
    .filters {
      display: flex;
      gap: 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filters label {
      font-size: 1rem;
      font-weight: 500;
      color: #444;
      margin-right: 6px;
    }
    .filters select, .filters input[type="date"] {
      padding: 7px 14px;
      border-radius: 5px;
      border: 1px solid #d9d9d9;
      font-size: 1rem;
      background: #fff;
      color: #222;
    }
    .btn-buscar {
      background: #1a6ae5;
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
      margin-left: 8px;
      align-self: flex-end;
    }
    .btn-buscar:hover {
      background: #144fa1;
    }
    .table-section {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      padding: 28px 18px 18px 18px;
      margin-top: 0;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 18px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      font-size: 1rem;
    }
    .data-table th, .data-table td {
      padding: 12px 10px;
      text-align: left;
    }
    .data-table th {
      background: #f5f6fa;
      color: #222;
      font-weight: 700;
      border-bottom: 2px solid #eaeaea;
    }
    .data-table tr {
      border-bottom: 1px solid #f0f0f0;
    }
    .data-table tr:last-child {
      border-bottom: none;
    }
    .btn-table {
      background: #1a6ae5;
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }
    .btn-table:hover {
      background: #144fa1;
    }
    @media (max-width: 1000px) {
      .main-content {
        padding: 0 4vw 24px 4vw;
      }
      .sidebar {
        width: 60px;
        padding: 10px 0;
      }
      .sidebar nav a {
        font-size: 0.95rem;
        padding: 10px 10px;
        text-align: center;
      }
      .sidebar img { width: 38px; }
    }
    @media (max-width: 700px) {
      .main-header { font-size: 1.1rem; }
      .sidebar { display: none; }
      .main-content { padding: 0 2vw 18px 2vw; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Menu principal">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_192,h_192,al_c,q_85/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
      <nav>
        <a href="dashboard-comprador.html" class="active">Dashboard</a>
        <a href="#">Aprovações Pendentes</a>
        <a href="#">Histórico</a>
        <a href="#">Fornecedores</a>
        <a href="#">Relatórios</a>
        <a href="#">Perfil</a>
        <a href="#" style="color:#d4380d;">Sair</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="main-header">Dashboard do Comprador</header>
      <form class="filters" id="filtrosForm" aria-label="Filtros de pesquisa" onsubmit="event.preventDefault(); buscarTabelas();">
        <label>Fornecedor:
          <select id="fornecedorSelect" name="fornecedor">
            <option value="">Todos</option>
            <option value="ambev">Ambev</option>
            <option value="nestle">Nestlé</option>
            <option value="unilever">Unilever</option>
            <option value="cocacola">Coca-Cola</option>
            <option value="brf">BRF</option>
            <option value="jbs">JBS</option>
            <option value="mondelez">Mondelez</option>
            <option value="pepsico">PepsiCo</option>
          </select>
        </label>
        <label>Bandeira:
          <select id="bandeiraSelect" name="bandeira" onchange="atualizarUFs()">
            <option value="">Todas</option>
            <option value="superpao">Superpão</option>
            <option value="boa">Boa Supermercados</option>
            <option value="avenida">Supermercados Avenida</option>
            <option value="compremais">Compre Mais</option>
            <option value="emporio">Empório Dom Olívio</option>
            <option value="amigao">Grupo Amigão</option>
            <option value="parana">Paraná Supermercados</option>
          </select>
        </label>
        <label>UF:
          <select id="ufSelect" name="uf">
            <option value="">Todas</option>
          </select>
        </label>
        <label>Data:
          <input type="date" id="dataInput" name="data">
        </label>
        <button type="submit" class="btn-buscar">Buscar</button>
      </form>
      <section class="table-section" id="tabelasSection" style="display:none;">
        <div class="section-title">Tabelas Enviadas pelo Fornecedor</div>
        <table class="data-table" id="tabelasTable" aria-label="Tabelas enviadas">
          <thead>
            <tr>
              <th>Fornecedor</th>
              <th>Bandeira</th>
              <th>UF</th>
              <th>Data Submissão</th>
              <th>Status de Avaliação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Conteúdo dinâmico -->
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script>
    // Mapeamento das bandeiras para UFs
    const bandeiraUFs = {
      superpao: ['PR','SC','RS'],
      boa: ['SP','MG'],
      avenida: ['MS','MT'],
      compremais: ['GO','DF','TO'],
      emporio: ['RJ','ES'],
      amigao: ['BA','SE','AL'],
      parana: ['PR','SP']
    };

    function atualizarUFs() {
      const bandeira = document.getElementById('bandeiraSelect').value;
      const ufSelect = document.getElementById('ufSelect');
      ufSelect.innerHTML = '<option value="">Todas</option>';
      if (bandeira && bandeiraUFs[bandeira]) {
        bandeiraUFs[bandeira].forEach(uf => {
          const opt = document.createElement('option');
          opt.value = uf;
          opt.textContent = uf;
          ufSelect.appendChild(opt);
        });
      }
    }

    // Simulação de dados de tabelas enviadas
    const tabelasSimuladas = [
      {
        fornecedor: 'Ambev', bandeira: 'Superpão', uf: 'PR', data: '2024-06-10', status: 'Em Análise'
      },
      {
        fornecedor: 'Nestlé', bandeira: 'Boa Supermercados', uf: 'SP', data: '2024-06-09', status: 'Aprovada'
      },
      {
        fornecedor: 'Unilever', bandeira: 'Supermercados Avenida', uf: 'MS', data: '2024-06-08', status: 'Reprovada'
      },
      {
        fornecedor: 'Coca-Cola', bandeira: 'Compre Mais', uf: 'GO', data: '2024-06-11', status: 'Em Análise'
      },
      {
        fornecedor: 'BRF', bandeira: 'Empório Dom Olívio', uf: 'ES', data: '2024-06-07', status: 'Aprovada'
      },
      {
        fornecedor: 'JBS', bandeira: 'Grupo Amigão', uf: 'BA', data: '2024-06-06', status: 'Em Análise'
      },
      {
        fornecedor: 'Mondelez', bandeira: 'Paraná Supermercados', uf: 'PR', data: '2024-06-05', status: 'Reprovada'
      },
      {
        fornecedor: 'PepsiCo', bandeira: 'Superpão', uf: 'SC', data: '2024-06-10', status: 'Aprovada'
      }
    ];

    function buscarTabelas() {
      const fornecedorSel = document.getElementById('fornecedorSelect').value;
      const bandeiraSel = document.getElementById('bandeiraSelect').value;
      const ufSel = document.getElementById('ufSelect').value;
      const dataSel = document.getElementById('dataInput').value;
      let resultados = tabelasSimuladas.filter(tab => {
        let ok = true;
        if (fornecedorSel && tab.fornecedor.toLowerCase() !== fornecedorSel) ok = false;
        if (bandeiraSel) {
          // Mapear valor para label
          const mapBandeira = {
            superpao: 'Superpão', boa: 'Boa Supermercados', avenida: 'Supermercados Avenida', compremais: 'Compre Mais', emporio: 'Empório Dom Olívio', amigao: 'Grupo Amigão', parana: 'Paraná Supermercados'
          };
          if (tab.bandeira !== mapBandeira[bandeiraSel]) ok = false;
        }
        if (ufSel && tab.uf !== ufSel) ok = false;
        if (dataSel && tab.data < dataSel) ok = false;
        return ok;
      });
      const tbody = document.querySelector('#tabelasTable tbody');
      tbody.innerHTML = '';
      if (resultados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">Nenhuma tabela encontrada para os filtros selecionados.</td></tr>';
      } else {
        resultados.forEach(tab => {
          let acao = '';
          if (tab.status === 'Em Análise') {
            const params = new URLSearchParams({
              fornecedor: tab.fornecedor,
              bandeira: tab.bandeira,
              uf: tab.uf,
              data: tab.data
            }).toString();
            acao = `<button class="btn-table" onclick="window.location.href='analise-tabela.html?${params}'">Aprovar/Reprovar</button>`;
          } else {
            acao = '<span style="color:#888;">Visualizar</span>';
          }
          tbody.innerHTML += `<tr>
            <td>${tab.fornecedor}</td>
            <td>${tab.bandeira}</td>
            <td>${tab.uf}</td>
            <td>${tab.data}</td>
            <td>${tab.status}</td>
            <td>${acao}</td>
          </tr>`;
        });
      }
      document.getElementById('tabelasSection').style.display = 'block';
    }

    // Inicializa UFs ao carregar
    window.addEventListener('DOMContentLoaded', function() {
      atualizarUFs();
    });
  </script>
</body>
</html>
