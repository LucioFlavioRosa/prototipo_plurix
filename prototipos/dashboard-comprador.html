<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard do Comprador - Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="shortcut icon" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_32%2Ch_32%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_180%2Ch_180%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 32px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.03);
    }
    .sidebar img {
      width: 60px;
      margin-bottom: 18px;
    }
    .sidebar nav {
      width: 100%;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sidebar a {
      display: block;
      width: 100%;
      padding: 12px 32px;
      color: #1a6ae5;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px 0 0 6px;
      font-size: 1.08rem;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar a.active, .sidebar a:hover {
      background: #eaf2ff;
      color: #144fa1;
    }
    .main-content {
      flex: 1;
      padding: 0 40px 40px 40px;
      display: flex;
      flex-direction: column;
    }
    .main-header {
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eaeaea;
      background: #fff;
      margin-bottom: 32px;
      padding-left: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }
    .filters {
      display: flex;
      gap: 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filters label {
      font-size: 1rem;
      font-weight: 500;
      color: #444;
      margin-right: 6px;
    }
    .filters select, .filters input[type="date"] {
      padding: 7px 14px;
      border-radius: 5px;
      border: 1px solid #d9d9d9;
      font-size: 1rem;
      background: #fff;
      color: #222;
    }
    .table-section {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      padding: 28px 18px 18px 18px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 18px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      font-size: 1rem;
    }
    .data-table th, .data-table td {
      padding: 12px 10px;
      text-align: left;
    }
    .data-table th {
      background: #f5f6fa;
      color: #222;
      font-weight: 700;
      border-bottom: 2px solid #eaeaea;
    }
    .data-table tr {
      border-bottom: 1px solid #f0f0f0;
    }
    .data-table tr:last-child {
      border-bottom: none;
    }
    .btn-table {
      background: #1a6ae5;
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }
    .btn-table:hover {
      background: #144fa1;
    }
    .btn-buscar {
      background: #1a6ae5;
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
      margin-left: 12px;
      height: 40px;
      align-self: flex-end;
    }
    .btn-buscar:hover {
      background: #144fa1;
    }
    @media (max-width: 1000px) {
      .main-content {
        padding: 0 4vw 24px 4vw;
      }
      .sidebar {
        width: 60px;
        padding: 10px 0;
      }
      .sidebar nav a {
        font-size: 0.95rem;
        padding: 10px 10px;
        text-align: center;
      }
      .sidebar img { width: 38px; }
    }
    @media (max-width: 700px) {
      .main-header { font-size: 1.1rem; }
      .sidebar { display: none; }
      .main-content { padding: 0 2vw 18px 2vw; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Menu principal">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_192,h_192,al_c,q_85/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
      <nav>
        <a href="dashboard-comprador.html" class="active">Dashboard</a>
        <a href="#">Aprovações Pendentes</a>
        <a href="#">Histórico</a>
        <a href="#">Fornecedores</a>
        <a href="#">Relatórios</a>
        <a href="#">Perfil</a>
        <a href="#" style="color:#d4380d;">Sair</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="main-header">Dashboard do Comprador</header>
      <form class="filters" id="form-filtros" aria-label="Filtros de pesquisa" onsubmit="buscarTabelas(event)">
        <label>Fornecedor:
          <select id="filtro-fornecedor" name="fornecedor">
            <option value="">Todos</option>
            <option value="ambev">Ambev</option>
            <option value="nestle">Nestlé</option>
            <option value="unilever">Unilever</option>
            <option value="cocacola">Coca-Cola</option>
            <option value="brf">BRF</option>
            <option value="jbs">JBS</option>
            <option value="mondelez">Mondelez</option>
            <option value="pepsico">PepsiCo</option>
          </select>
        </label>
        <label>Bandeira:
          <select id="filtro-bandeira" name="bandeira">
            <option value="">Todas</option>
            <option value="superpao">Superpão</option>
            <option value="boa">Boa Supermercados</option>
            <option value="avenida">Supermercados Avenida</option>
            <option value="compremais">Compre Mais</option>
            <option value="emporio">Empório Dom Olívio</option>
            <option value="amigao">Grupo Amigão</option>
            <option value="parana">Paraná Supermercados</option>
          </select>
        </label>
        <label>UF:
          <select id="filtro-uf" name="uf">
            <option value="">Todas</option>
          </select>
        </label>
        <label>Data:
          <input type="date" id="filtro-data" name="data">
        </label>
        <button type="submit" class="btn-buscar">Buscar</button>
      </form>
      <section class="table-section" id="tabelas-section">
        <div class="section-title">Tabelas Submetidas</div>
        <div id="tabelas-resultados">
          <!-- Tabela dinâmica será inserida aqui -->
        </div>
      </section>
    </main>
  </div>
  <script>
    // Mapeamento de bandeiras para UFs
    const bandeiraUFs = {
      superpao: ['PR','SC','RS'],
      boa: ['SP','MG'],
      avenida: ['MS','MT'],
      compremais: ['GO','DF','TO'],
      emporio: ['RJ','ES'],
      amigao: ['BA','SE','AL'],
      parana: ['PR','SP']
    };

    // Atualiza UFs ao mudar a bandeira
    document.getElementById('filtro-bandeira').addEventListener('change', function() {
      const ufSelect = document.getElementById('filtro-uf');
      const bandeira = this.value;
      ufSelect.innerHTML = '<option value="">Todas</option>';
      if (bandeiraUFs[bandeira]) {
        bandeiraUFs[bandeira].forEach(function(uf) {
          const opt = document.createElement('option');
          opt.value = uf;
          opt.textContent = uf;
          ufSelect.appendChild(opt);
        });
      }
    });

    // Simulação de dados de submissão de tabelas
    const tabelasSubmetidas = [
      {
        fornecedor: 'Ambev', bandeira: 'Superpão', uf: 'PR', data: '2024-06-10', status: 'Em Análise'
      },
      {
        fornecedor: 'Nestlé', bandeira: 'Boa Supermercados', uf: 'MG', data: '2024-06-09', status: 'Aprovada'
      },
      {
        fornecedor: 'JBS', bandeira: 'Grupo Amigão', uf: 'BA', data: '2024-06-08', status: 'Reprovada'
      },
      {
        fornecedor: 'Ambev', bandeira: 'Superpão', uf: 'SC', data: '2024-06-07', status: 'Aprovada'
      },
      {
        fornecedor: 'Coca-Cola', bandeira: 'Paraná Supermercados', uf: 'PR', data: '2024-06-11', status: 'Em Análise'
      },
      {
        fornecedor: 'BRF', bandeira: 'Compre Mais', uf: 'GO', data: '2024-06-10', status: 'Aprovada'
      },
      {
        fornecedor: 'PepsiCo', bandeira: 'Empório Dom Olívio', uf: 'RJ', data: '2024-06-09', status: 'Em Análise'
      },
      {
        fornecedor: 'Unilever', bandeira: 'Supermercados Avenida', uf: 'MT', data: '2024-06-08', status: 'Aprovada'
      },
      {
        fornecedor: 'Mondelez', bandeira: 'Boa Supermercados', uf: 'SP', data: '2024-06-07', status: 'Reprovada'
      }
    ];

    // Função para buscar e exibir tabelas
    function buscarTabelas(event) {
      if (event) event.preventDefault();
      const fornecedorSel = document.getElementById('filtro-fornecedor').value;
      const bandeiraSel = document.getElementById('filtro-bandeira').value;
      const ufSel = document.getElementById('filtro-uf').value;
      const dataSel = document.getElementById('filtro-data').value;
      let resultados = tabelasSubmetidas.filter(function(tab) {
        let ok = true;
        if (fornecedorSel && tab.fornecedor.toLowerCase() !== fornecedorSel) ok = false;
        if (bandeiraSel) {
          // Bandeira no dado é nome completo, no select é slug
          const mapBandeira = {
            superpao: 'Superpão',
            boa: 'Boa Supermercados',
            avenida: 'Supermercados Avenida',
            compremais: 'Compre Mais',
            emporio: 'Empório Dom Olívio',
            amigao: 'Grupo Amigão',
            parana: 'Paraná Supermercados'
          };
          if (tab.bandeira !== mapBandeira[bandeiraSel]) ok = false;
        }
        if (ufSel && tab.uf !== ufSel) ok = false;
        if (dataSel && tab.data < dataSel) ok = false;
        return ok;
      });
      let html = '';
      if (resultados.length === 0) {
        html = '<div style="padding:16px;color:#888;">Nenhuma tabela encontrada para os filtros selecionados.</div>';
      } else {
        html = '<table class="data-table" aria-label="Tabelas submetidas">';
        html += '<thead><tr>' +
          '<th>Fornecedor</th>' +
          '<th>Bandeira</th>' +
          '<th>UF</th>' +
          '<th>Data Submissão</th>' +
          '<th>Status de Avaliação</th>' +
          '<th>Ações</th>' +
          '</tr></thead><tbody>';
        resultados.forEach(function(tab) {
          html += '<tr>' +
            '<td>' + tab.fornecedor + '</td>' +
            '<td>' + tab.bandeira + '</td>' +
            '<td>' + tab.uf + '</td>' +
            '<td>' + tab.data + '</td>' +
            '<td>' + tab.status + '</td>' +
            '<td>';
          if (tab.status === 'Em Análise') {
            // Monta query string
            const params = new URLSearchParams({
              fornecedor: tab.fornecedor,
              bandeira: tab.bandeira,
              uf: tab.uf,
              data: tab.data
            }).toString();
            html += '<button class="btn-table" onclick="window.location.href=\'analise-tabela.html?' + params + '\'">Aprovar/Reprovar</button>';
          } else if (tab.status === 'Aprovada' || tab.status === 'Reprovada') {
            html += 'Visualizar';
          } else {
            html += '';
          }
          html += '</td></tr>';
        });
        html += '</tbody></table>';
      }
      document.getElementById('tabelas-resultados').innerHTML = html;
    }

    // Exibe tabelas ao carregar a página
    window.addEventListener('DOMContentLoaded', function() {
      buscarTabelas();
    });
  </script>
</body>
</html>
