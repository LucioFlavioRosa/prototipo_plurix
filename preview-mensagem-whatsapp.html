<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview Mensagem WhatsApp | Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <link rel="stylesheet" href="dashboard-fornecedor.css">
  <script src="prototipos/js/preview-whatsapp.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_180,h_180,al_c,q_85,usm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
    </div>
    <nav>
      <a href="dashboard-fornecedor.html">Dashboard</a>
      <a href="nova-cotacao.html">Nova Cotação</a>
      <a href="preview-mensagem-whatsapp.html" class="active">Preview WhatsApp</a>
      <a href="audio-transcricao.html">Áudio & Transcrição</a>
      <a href="index.html">Sair</a>
    </nav>
    <div class="bottom">&copy; 2024 Plurix</div>
  </aside>
  <div class="main-content">
    <header class="header">
      <h1>Preview da Mensagem WhatsApp</h1>
    </header>
    <main class="dashboard-section">
      <section class="card">
        <div class="card-title">Dados da Cotação</div>
        <form id="form-cotacao-preview" autocomplete="off">
          <label for="produto">Produto:</label>
          <input type="text" id="produto" name="produto" required class="form-input">
          <label for="quantidade">Quantidade:</label>
          <input type="number" id="quantidade" name="quantidade" required min="1" class="form-input">
          <label for="prazo">Prazo de Entrega:</label>
          <input type="date" id="prazo" name="prazo" required class="form-input">
          <button type="button" class="cta-upload" onclick="gerarPreviewMensagem()">Gerar Preview</button>
        </form>
        <div id="preview-whatsapp" style="margin-top:32px; background:#e8eaf0; padding:24px; border-radius:8px; min-height:80px; font-size:1.12rem;"></div>
      </section>
    </main>
  </div>
</body>
</html>
