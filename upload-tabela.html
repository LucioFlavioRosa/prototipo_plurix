<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Tabela de Preços | Plurix</title>
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157%7Emv2.png" type="image/png"/>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Helvetica:400,700&display=swap');
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'helvetica-w01-roman', Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #222;
    }
    body {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #1a2340;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding-top: 32px;
      box-shadow: 2px 0 8px rgba(30,40,80,0.07);
      position: relative;
      z-index: 2;
    }
    .sidebar .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .sidebar .logo img {
      width: 120px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.10);
    }
    .sidebar nav {
      flex: 1;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      padding: 14px 32px;
      color: #fff;
      text-decoration: none;
      font-size: 1.08rem;
      border-left: 4px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 2px;
      border-radius: 4px 0 0 4px;
    }
    .sidebar nav a.active, .sidebar nav a:hover {
      background: #222b4a;
      border-left: 4px solid #f9b233;
      color: #f9b233;
    }
    .sidebar nav a[aria-label] {
      outline: none;
    }
    .sidebar .bottom {
      margin-bottom: 32px;
      text-align: center;
      font-size: 0.95rem;
      color: #b7b9c6;
    }
    .main-content {
      flex: 1;
      padding: 0 0 0 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      background: #fff;
      padding: 24px 40px 16px 40px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a2340;
      margin: 0;
    }
    .dashboard-section {
      padding: 32px 40px 40px 40px;
      flex: 1;
      background: #f7f8fa;
      min-height: 0;
    }
    .upload-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.07);
      padding: 32px 28px 26px 28px;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .upload-card h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a2340;
      margin-bottom: 18px;
    }
    .upload-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .upload-form label {
      font-weight: 600;
      color: #1a2340;
      margin-bottom: 6px;
    }
    .upload-form input[type="file"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #b7b9c6;
      background: #f7f8fa;
      color: #222;
      font-size: 1.05rem;
    }
    .upload-form button {
      background: #f9b233;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 28px;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
      box-shadow: 0 2px 8px rgba(249,178,51,0.08);
      margin-top: 10px;
    }
    .upload-form button:hover, .upload-form button:focus {
      background: #e1a12a;
      outline: 2px solid #f9b233;
    }
    .upload-form button[aria-label] {
      outline: none;
    }
    .upload-card .info {
      margin-top: 16px;
      color: #555;
      font-size: 0.98rem;
      text-align: center;
    }
    @media (max-width: 900px) {
      .dashboard-section {
        padding: 24px 10px 24px 10px;
      }
      .header {
        padding: 18px 10px 12px 10px;
      }
      .sidebar {
        width: 70px;
        padding-top: 12px;
      }
      .sidebar .logo img {
        width: 44px;
      }
      .sidebar nav a {
        padding: 10px 10px;
        font-size: 0.98rem;
      }
      .upload-card {
        padding: 18px 8px 16px 8px;
        max-width: 98vw;
      }
    }
    @media (max-width: 600px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100vw;
        height: 60px;
        flex-direction: row;
        align-items: center;
        padding-top: 0;
        box-shadow: 0 2px 8px rgba(30,40,80,0.07);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
      }
      .sidebar .logo {
        margin-bottom: 0;
        margin-left: 12px;
      }
      .sidebar nav {
        display: flex;
        flex-direction: row;
        flex: 1;
        justify-content: space-around;
      }
      .sidebar nav a {
        padding: 10px 8px;
        font-size: 0.95rem;
        margin-bottom: 0;
      }
      .sidebar .bottom {
        display: none;
      }
      .main-content {
        padding-top: 60px;
      }
      .dashboard-section {
        padding: 10px 2px 10px 2px;
      }
      .upload-card {
        padding: 12px 2px 10px 2px;
        max-width: 99vw;
      }
    }
  </style>
  <script>
    function goTo(page) {
      window.location.href = page;
    }
    function sair() {
      if (confirm('Deseja realmente sair?')) {
        window.location.href = 'index.html';
      }
    }
    function handleUpload(e) {
      e.preventDefault();
      alert('Arquivo enviado com sucesso! Sua tabela será processada.');
      window.location.href = 'dashboard-fornecedor.html';
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          window.location.href = 'dashboard-fornecedor.html';
        }
      });
    });
  </script>
</head>
<body>
  <aside class="sidebar" role="navigation" aria-label="Menu Principal">
    <div class="logo">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_180,h_180,al_c,q_85,usm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
    </div>
    <nav>
      <a href="dashboard-fornecedor.html" aria-label="Dashboard">Dashboard</a>
      <a href="upload-tabela.html" class="active" aria-label="Nova Tabela">Nova Tabela</a>
      <a href="historico.html" aria-label="Histórico">Histórico</a>
      <a href="index.html" onclick="sair()" aria-label="Sair">Sair</a>
    </nav>
    <div class="bottom">&copy; 2024 Plurix</div>
  </aside>
  <div class="main-content">
    <header class="header" role="banner">
      <h1>Nova Tabela de Preços</h1>
    </header>
    <main class="dashboard-section" role="main">
      <section class="upload-card" role="form" aria-label="Upload de Tabela">
        <h2>Enviar Nova Tabela de Preços</h2>
        <form class="upload-form" onsubmit="handleUpload(event)" aria-label="Formulário de Upload">
          <label for="file-upload">Selecione o arquivo (.xlsx):</label>
          <input type="file" id="file-upload" name="file-upload" accept=".xlsx" required aria-label="Selecionar arquivo">
          <button type="submit" aria-label="Enviar Tabela">Enviar</button>
        </form>
        <div class="info">Após o envio, sua tabela será auditada e você receberá notificações sobre o status da cotação.</div>
      </section>
    </main>
  </div>
</body>
</html>
