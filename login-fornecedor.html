  <style>
    @font-face {
      font-display: swap;
      font-family: wf_1973fffd9707483bb7143c4dc;

           url('https://static.wixstatic.com/ufonts/891e54_1973fffd9707483bb7143c4dc47ac236/woff/file.woff') format('woff');
    }
    @font-face {
      font-family: 'helvetica-w01-roman';
      font-style: normal;
      font-weight: 400;
      src: url('//static.parastorage.com/fonts/v2/2af1bf48-e783-4da8-9fa0-599dde29f2d5/v1/helvetica-lt-w10-roman.woff2') format('woff2');

    :root {
      --plurix-primary: #0c2340;
      --plurix-secondary: #f5b800;
      --plurix-bg: #f7f8fa;
      --plurix-gray: #e5e7eb;
      --plurix-dark: #222;
      --plurix-accent: #0098d8;
      --plurix-radius: 8px;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: wf_1973fffd9707483bb7143c4dc, 'helvetica-w01-roman', Arial, Helvetica, sans-serif;
      background: var(--plurix-bg);
      color: var(--plurix-dark);
      font-size: 16px;
    }
    header {
      background: var(--plurix-primary);
      color: #fff;
      padding: 0;
      box-shadow: 0 2px 8px rgba(12,35,64,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      margin-left: 32px;
    }
    .header-logo img {
      height: 48px;
      width: auto;
      margin-right: 16px;
    }
    .header-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 72px - 80px);
      padding-top: 48px;
    }
    .login-container {
      background: #fff;
      border-radius: var(--plurix-radius);
      box-shadow: 0 4px 24px rgba(12,35,64,0.07);
      padding: 48px 40px 40px 40px;
      min-width: 340px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 0.5s ease-out;
    }
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-container img {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
    }
    .login-container h2 {
      font-size: 1.6rem;
      color: var(--plurix-primary);
      font-weight: 700;
      margin-bottom: 32px;
      letter-spacing: 1px;
      transition: font-size 0.2s;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .form-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--plurix-primary);
      margin-bottom: 4px;
    }
    .form-input {
      padding: 12px 14px;
      border: 1px solid var(--plurix-gray);
      border-radius: var(--plurix-radius);
      font-size: 1rem;
      background: var(--plurix-bg);
      color: var(--plurix-dark);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--plurix-accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,152,216,0.1);
    }
    .form-hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: -12px;
      display: block;
    }
    .btn {
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 0;
      border: none;
      border-radius: var(--plurix-radius);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
      background: var(--plurix-primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(12,35,64,0.06);
      outline: none;
      text-align: center;
      display: inline-block;
      position: relative;
    }
    .btn:hover {
      background: #142d4c;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(12,35,64,0.12);
    }
    .btn-loading {
      cursor: wait !important;
      opacity: 0.7 !important;
    }
    .btn-loading::after {
      content: ' Entrando...';
      font-weight: 400;
      font-size: 1rem;
      margin-left: 8px;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink {
      to { opacity: 0.4; }
    }
    .login-links {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 20px;
    }
    .login-links a {
      color: var(--plurix-accent);
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .login-links a:hover {
      color: var(--plurix-primary);
      text-decoration: underline;
    }
    footer {
      background: var(--plurix-primary);
      color: #fff;
      text-align: center;
      padding: 24px 0 12px 0;
      font-size: 1rem;
      margin-top: 48px;
    }
    @media (max-width: 600px) {
      .login-container {
        min-width: 92vw;
        max-width: 96vw;
        padding: 32px 20px 28px 20px;
      }
      .login-container h2 {
        font-size: 1.4rem;
      }
      .header-logo {
        margin-left: 12px;
      }
    }
  </style>
  <script>
    function formatCNPJ(value) {
      return value.replace(/\D/g, '');
    }

    function validateForm(e) {
      const emailCnpj = document.getElementById('emailCnpj');
      const senha = document.getElementById('senha');
      const btn = document.getElementById('btn-entrar');
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const cnpjRegex = /^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$/;
      const valor = emailCnpj.value.trim();
      const senhaValor = senha.value;
      // 1. Verificar campos vazios
      if (!valor || !senhaValor) {
        alert('Preencha todos os campos para continuar.');
        e.preventDefault();
        return false;
      }
      // 2. Validar formato (e-mail OU CNPJ)
      if (valor.includes('@')) {
        if (!emailRegex.test(valor)) {
          alert('Formato de e-mail inválido');
          e.preventDefault();
          return false;
        }
      } else {
        // Aceita CNPJ com ou sem pontuação
        if (!cnpjRegex.test(valor)) {
          alert('Formato de CNPJ inválido');
          e.preventDefault();
          return false;
        }
      }
      // 3. Verificar credenciais hardcoded
      if (valor === 'joao.silva@ambev.com.br' && senhaValor === 'fornecedor') {
        btn.classList.add('btn-loading');
        setTimeout(function() {
          window.location.href = 'dashboard-fornecedor.html';
        }, 800);
        e.preventDefault();
        return false;
      } else {
        alert('Credenciais inválidas');
        e.preventDefault();
        return false;
      }
    }
  </script>

<body>
  <header>
    <div class="header-logo">

      <span class="header-title">Portal do Fornecedor</span>
    </div>
  </header>
  <main>
    <div class="login-container">
      <img src="https://static.wixstatic.com/media/511fa0_114311e069c34ae48f752e23361e9157~mv2.png/v1/fill/w_192,h_192,lg_1,usm_0.66_1.00_0.01/511fa0_114311e069c34ae48f752e23361e9157~mv2.png" alt="Logo Plurix">
      <h2>Acesse sua conta de Fornecedor</h2>
      <form action="#" method="post" onsubmit="return validateForm(event)" novalidate>
        <label for="emailCnpj" class="form-label">E-mail ou CNPJ</label>
        <input type="text" id="emailCnpj" name="emailCnpj" class="form-input" placeholder="Digite seu e-mail ou CNPJ" autocomplete="username" required inputmode="email">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" name="senha" class="form-input" placeholder="Digite sua senha" autocomplete="current-password" required>
        <button type="submit" class="btn" id="btn-entrar">Entrar</button>
      </form>
      <div class="login-links">
        <a href="#" aria-label="Recuperar senha">Esqueci minha senha</a>
      </div>
    </div>
  </main>

  </footer>
